<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>All Around Weather</title>
    <script src="utilities.js" defer></script>
</head>
<body>
    <main>
        <section class="weather-section">
            <h1>All Around Weather</h1>
            <label for="locationInput">Location</label>
            <input id="locationInput" type="text" value="East Lansing" placeholder="City or area">
            <label for="dateInput">Date</label>
            <input id="dateInput" type="date">
            <button id="weatherButton" type="button">See your weather</button>
            <p id="weatherDisplay" aria-live="polite"></p>
        </section>
    </main>
    <footer class="site-footer">
        <p>Enjoy the weather wherever you are!</p>
    </footer>
</body>
</html>
